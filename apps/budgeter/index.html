<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      Budgeter — Turn a UK salary into monthly take-home pay, then see what is left after your
      spending.
    </title>
    <meta
      name="description"
      content="Turn a UK salary into monthly take-home pay, then see what is left after your spending. Free, no sign-up, works in your browser."
    />
    <link rel="canonical" href="https://budgeter.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Budgeter" />
    <meta
      property="og:description"
      content="Turn a UK salary into monthly take-home pay, then see what is left after your spending."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:url" content="https://budgeter.pages.dev/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Budgeter",
        "description": "Turn a UK salary into monthly take-home pay, then see what is left after your spending.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
      }
    </script>

    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* private mode: fall back to the media query */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
