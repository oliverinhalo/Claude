<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      Trainyard — Teach your webcam to recognise things. Record examples, label them, and train
      an image classifier that never leaves your browser.
    </title>
    <meta
      name="description"
      content="Teach your webcam to recognise things. Record examples, label them, and train an image classifier that never leaves your browser. Free, no sign-up, works in your browser."
    />
    <link rel="canonical" href="https://trainyard.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trainyard" />
    <meta
      property="og:description"
      content="Teach your webcam to recognise things. Record examples, label them, and train an image classifier that never leaves your browser."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:url" content="https://trainyard.pages.dev/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f5ee" media="(prefers-color-scheme: light)" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Trainyard",
        "description": "Teach your webcam to recognise things. Record examples, label them, and train an image classifier that never leaves your browser.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* private mode: fall back to the media query */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
