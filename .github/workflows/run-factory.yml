name: Run factory now

# The factory's engine: scheduled runs and on-demand runs, both here.
#
# This replaced Claude Routines, which could not work. A routine-fired session is
# created with no repository sources, so it has no git credential and no GitHub
# token: `git push` returns 403 ("not in this session's authorized set") and the
# API rejects it. A fired run proved it — it read the pipeline, found it could not
# write, and stopped. An Actions runner has both, and is not behind that proxy.
#
# Authenticated by CLAUDE_CODE_OAUTH_TOKEN, which uses the Claude subscription
# rather than metered API billing. Generate one with `claude setup-token`; see
# docs/SETUP.md step 6. Without it this workflow explains itself and exits
# cleanly rather than failing noisily every morning.

on:
  schedule:
    # Times are UTC, so these land an hour later in London during BST.
    - cron: '43 7 * * 1'          # Monday: start a new app
    - cron: '17 7 * * 0,2,3,4,5,6' # Other days: continue, polish, or improve
  workflow_dispatch:
    inputs:
      mode:
        description: What the run should do
        required: true
        default: continue
        type: choice
        options:
          - continue        # resume a checkpoint, polish, or raise a weak app
          - new-app         # start a new app this run
      focus:
        description: 'Optional: an issue number or a sentence telling it what to work on'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write
  # claude-code-action authenticates by exchanging a GitHub OIDC token. Without
  # this it fails before doing anything: "Could not fetch an OIDC token."
  id-token: write

concurrency:
  group: factory-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check Claude is configured
        id: check
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$OAUTH" ]; then
            {
              echo "### Not run — on-demand runs are not set up yet"
              echo
              echo "This needs one secret, generated from your own machine:"
              echo
              echo '```bash'
              echo 'claude setup-token'
              echo '```'
              echo
              echo "Add the result as \`CLAUDE_CODE_OAUTH_TOKEN\` at"
              echo "<https://github.com/${{ github.repository }}/settings/secrets/actions/new>."
              echo
              echo "It authenticates with your Claude subscription, not metered API"
              echo "billing. Full steps are in \`docs/SETUP.md\` step 6."
              echo
              echo "Until then, runs happen on their schedule: Mondays 07:43 and"
              echo "Tuesday to Sunday 07:17, Europe/London."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — see the run summary."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Build the run prompt
        id: prompt
        if: steps.check.outputs.ready == 'true'
        env:
          # A scheduled run has no inputs: Monday starts an app, other days continue.
          MODE: ${{ inputs.mode || (github.event.schedule == '43 7 * * 1' && 'new-app' || 'continue') }}
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo 'text<<PROMPT_EOF'
            echo "An on-demand factory run, started by the owner from the Factory Console."
            echo
            echo "Read these first, in order:"
            echo "  1. CLAUDE.md"
            echo "  2. .claude/skills/ship-weekly-app/SKILL.md — the pipeline. Follow it."
            echo "  3. factory/scripts/inbox.sh — what the owner has asked for. This outranks your own plan."
            echo "  4. factory/scripts/preflight.sh — which capabilities apply."
            echo "  5. ls factory/state/run/ — an in_progress checkpoint means you are RESUMING."
            echo
            if [ "$MODE" = "new-app" ]; then
              echo "Mode: NEW APP. Run the full pipeline and publish a new app to its own repository."
            else
              echo "Mode: CONTINUE. Finish an interrupted run if one exists; otherwise climb the"
              echo "polish ladder on the most recent app, or raise the lowest-scored app in the ledger."
              echo "Do not start a new app unless there is genuinely nothing else worth doing."
            fi
            if [ -n "$FOCUS" ]; then
              echo
              echo "The owner asked specifically for this, and it takes priority:"
              echo "  $FOCUS"
            fi
            echo
            echo "HEADLESS RUN — THE RULE THAT MATTERS MOST:"
            echo "You are running non-interactively. There is no next turn. If you end"
            echo "your turn, this run ends and everything uncommitted is lost."
            echo "- Run EVERY sub-agent with run_in_background: false. You need its result"
            echo "  to continue, which is exactly when foreground is right."
            echo "- Never say you will wait for something, check back later, or sleep."
            echo "  Nothing will wake you."
            echo "- Commit and push before you stop, for any reason."
            echo "Ten runs in a row died here: each spawned the qa agent, said it was"
            echo "waiting for it, ended the turn, and shipped nothing — while reporting"
            echo "success. Do not repeat it."
            echo
            echo "Hard rules that still apply:"
            echo "- Only ideas labelled 'approved' may be built. Never build or approve a"
            echo "  'pending-approval' idea — that decision is the owner's alone."
            echo "- factory/scripts/quality-gate.sh must exit 0 before anything is published."
            echo "  Never weaken a check to make it pass."
            echo "- Free tiers only. Nothing that can bill."
            echo "- Checkpoint at every phase boundary and commit often; this job has a time"
            echo "  limit and committed work is the only work that survives it."
            echo "- Publish with factory/scripts/publish.sh, which dispatches publish-app.yml."
            echo "  Verify the live URL yourself before touching the ledger."
            echo "- Close every inbox issue you acted on with a reply saying what you did."
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Note the starting commit
        id: before
        if: steps.check.outputs.ready == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the factory
        id: claude
        if: steps.check.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          # Bash is DISABLED by default in this action. Without granting it the
          # run ends in seconds with permission_denials and reports success —
          # which is exactly what happened the first time. The pipeline runs npm,
          # playwright, git, gh and its own scripts, so enumerating individual
          # commands would just fail somewhere new each run; the runner is
          # ephemeral and scoped to this repo, so the tool is granted whole.
          claude_args: >-
            --max-turns 300
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,Task,WebSearch,WebFetch,TodoWrite

      # A run that does nothing still exits 0. For ten days every scheduled run
      # reported success, did 8-12 turns, and advanced nothing — and the first
      # version of this check could not tell, because it parsed the execution log
      # wrongly and read zeros. So: parse it properly, and judge on whether the
      # repository actually changed.
      - name: Check the run actually did something
        if: steps.check.outputs.ready == 'true' && always()
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/claude-execution-output.json"

          TURNS=0; DENIALS=0; ERR=false; SAID=""
          if [ -f "$OUT" ]; then
            # The file is a JSON array of stream events, so slurping it yields a
            # nested array. flatten handles both that and newline-delimited JSON.
            read -r DENIALS TURNS ERR <<<"$(jq -rs '
              flatten | map(select(type=="object" and .type=="result")) | last // {}
              | "\(.permission_denials_count // 0) \(.num_turns // 0) \(.is_error // false)"
            ' "$OUT" 2>/dev/null || echo "0 0 false")"

            # The agent's last words: the single most useful line for diagnosis.
            SAID="$(jq -rs '
              flatten
              | map(select(type=="object" and .type=="assistant")
                    | .message.content // [] | map(select(.type=="text") | .text) | join(" "))
              | map(select(length > 0)) | last // ""
            ' "$OUT" 2>/dev/null | head -c 1500)"
          else
            echo "::warning::No execution log at $OUT."
          fi

          AFTER="$(git rev-parse HEAD)"
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)" 2>/dev/null || true
          NEW_COMMITS="$(git rev-list --count "${BEFORE}..${AFTER}" 2>/dev/null || echo 0)"
          PUSHED="$(git rev-list --count "${BEFORE}..origin/$(git rev-parse --abbrev-ref HEAD)" 2>/dev/null || echo 0)"
          CHANGED=$(( NEW_COMMITS > PUSHED ? NEW_COMMITS : PUSHED ))

          {
            echo "### Claude run"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Turns | $TURNS |"
            echo "| Permission denials | $DENIALS |"
            echo "| Commits made | $CHANGED |"
            if [ -n "$SAID" ]; then
              echo
              echo "**It finished by saying:**"
              echo
              echo "> $SAID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DENIALS:-0}" -gt 0 ]; then
            echo "::error::Claude was denied $DENIALS tool call(s). Grant the tool in claude_args --allowedTools."
            exit 1
          fi

          # The real test: did anything change? A run that commits nothing and
          # barely took a turn did not do the job, whatever it exited with.
          if [ "$CHANGED" -eq 0 ] && [ "${TURNS:-0}" -lt 25 ]; then
            {
              echo
              echo "**This run changed nothing.** $TURNS turns, no commits. A factory run"
              echo "that builds, polishes or publishes anything commits as it goes."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Run made no commits in $TURNS turns — it did not do the work. See the summary for what it said."
            exit 1
          fi

          if [ "$CHANGED" -eq 0 ]; then
            echo "::warning::$TURNS turns but no commits — check the summary for what it decided."
          fi

      - name: Keep the transcript
        if: steps.check.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcript-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report where to look
        if: steps.check.outputs.ready == 'true' && always()
        run: |
          {
            echo "### Run finished"
            echo
            echo "- Mode: \`${{ steps.prompt.outputs.mode }}\`"
            echo "- Console: <https://oliverinhalo.github.io/factory-console/>"
            echo "- Shipped apps: \`factory/state/shipped.md\`"
            echo "- Run reports: \`factory/state/reports/\`"
          } >> "$GITHUB_STEP_SUMMARY"
