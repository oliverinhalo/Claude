name: Deploy console auth

# Deploys the Factory Console's auth backend to Cloudflare Workers (free plan).
# Runs on a change to the service, or on demand. Skips cleanly with an
# explanation when Cloudflare is not configured, so it never fails noisily.

on:
  push:
    branches: [main]
    paths:
      - 'services/console-auth/**'
      - '.github/workflows/deploy-console-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check Cloudflare is configured
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          OAUTH_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$CF_TOKEN" ]     || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ]   || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          [ -n "$OAUTH_ID" ]     || MISSING="$MISSING GH_OAUTH_CLIENT_ID"
          [ -n "$OAUTH_SECRET" ] || MISSING="$MISSING GH_OAUTH_CLIENT_SECRET"
          if [ -n "$MISSING" ]; then
            {
              echo "### Not deployed — sign-in is not configured yet"
              echo
              echo "Missing secrets:"
              for s in $MISSING; do echo "- \`$s\`"; done
              echo
              echo "Add them at <https://github.com/${{ github.repository }}/settings/secrets/actions>."
              echo "Steps are in \`docs/SETUP.md\` step 5. Until then the console works"
              echo "without sign-in and only you, with a pasted token, can submit."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/console-auth/package-lock.json

      - name: Verify before deploying
        if: steps.check.outputs.ready == 'true'
        working-directory: services/console-auth
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Set the Worker's secrets
        if: steps.check.outputs.ready == 'true'
        working-directory: services/console-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          OAUTH_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          PAT: ${{ secrets.FACTORY_GH_TOKEN }}
          SUPPLIED_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx wrangler secret put "$1" >/dev/null; echo "set $1"; }

          put GITHUB_CLIENT_ID "$OAUTH_ID"
          put GITHUB_CLIENT_SECRET "$OAUTH_SECRET"
          put FACTORY_GH_TOKEN "$PAT"

          # The signing key must stay stable, or every session is invalidated on
          # each deploy. Only set it when it does not already exist.
          if [ -n "$SUPPLIED_SESSION_SECRET" ]; then
            put SESSION_SECRET "$SUPPLIED_SESSION_SECRET"
          elif npx wrangler secret list 2>/dev/null | grep -q SESSION_SECRET; then
            echo "SESSION_SECRET already set — left alone so sessions survive"
          else
            put SESSION_SECRET "$(openssl rand -base64 48)"
            echo "::notice::Generated a SESSION_SECRET. Everyone stays signed in until it is rotated."
          fi

      - name: Deploy
        id: deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: services/console-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)"
          [ -n "$URL" ] || URL="(check the log above for the Worker URL)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Confirm it answers
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          case "$URL" in https://*) ;; *) echo "::warning::No Worker URL parsed; skipping check"; exit 0;; esac
          for i in $(seq 1 10); do
            CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$URL/health" 2>/dev/null)" || CODE=000
            [ "$CODE" = "200" ] && break
            sleep 6
          done
          [ "$CODE" = "200" ] || { echo "::error::$URL/health returned $CODE"; exit 1; }
          {
            echo "### Sign-in backend deployed"
            echo
            echo "- Worker: \`$URL\`"
            echo "- Health: \`$(cat /tmp/health.json)\`"
            echo
            echo "**Two things to finish, once:**"
            echo "1. In your GitHub OAuth app, set the callback URL to \`$URL/auth/callback\`"
            echo "2. Add a repository variable \`VITE_API_BASE\` = \`$URL\`, then republish the console"
          } >> "$GITHUB_STEP_SUMMARY"
